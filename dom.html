<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document Object Model</title>

        <style>
            .newClass {
                color: green;
            }
        </style>
    </head>
    <body>
        <h1 id="heading">My Heading</h1>
        <p id="paragraph">My paragraph.</p>
        <button class="btn">Click Me 1</button>
        <button class="btn">Click Me 2</button>
        <button class="btn">Click Me 3</button>
        <button class="btn">Click Me 4</button>
        <div id="newDivParent" style="background-color: red;">

        </div>
    </body>
    <script>

        //Getting Elements By ID
        const heading = document.getElementById('heading'); //returns single element
        console.log(heading);
        heading.textContent = "I was changed using DOM";
        heading.style = "font-size: 120px";
        heading.setAttribute('class', 'newClass');
        const newDivUnderButtons = document.createElement('div');
        newDivUnderButtons.textContent = "I am a new div under buttons buttons";
        console.log(newDivUnderButtons);
        document.getElementById('newDivParent').appendChild(newDivUnderButtons); // append element to paghe/other elememnts
        


        const paragraph = document.getElementById('paragraph') //returns single element
        console.log(paragraph);
 
        const buttons = document.getElementsByClassName('btn'); // returns HTMLCollectionn (multiple elements)
        console.log(buttons);

        document.body.removeChild(paragraph) // remove element from page

        const tagName = document.getElementsByTagName('button'); // returns HTMLCollectionn (multiple elements)
        console.log(tagName);


        const queryElement = document.querySelector('.btn'); // returns single element (the first on the page)
        console.log(queryElement);

        const queryElements = document.querySelectorAll('.btn'); // returns NodeList (same as HTMLCollection)
        console.log(queryElements);

    </script>
</html>
