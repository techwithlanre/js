    <h1>Arrays</h1>
    <p>Arrays are used to store multiple values in a single variable.</p>
    <p>Arrays are indexed, meaning they have a number associated with each element.</p>
    <p>Arrays can be used to store any data of any type.</p>
    <p>Arrays can be used to store multiple values in a single variable.</p>



    <script>
        let fruits = ["apple", "banana", "orange"];
        console.log(fruits[0]); //apple
        console.log(fruits[1]); //banana
        console.log(fruits[2]);//orange

        fruits[1] = "mango";
        console.log(fruits[1]); //mango



        //Array Functions/Methods
        //length

        console.log(fruits.length); //3


        //Push
        //The push() method adds one or more elements to the end of an array. Here's an example:
        fruits.push("peach");
        console.log(fruits); //["apple", "banana", "orange", "peach"]


        //Pop
        //The pop() method removes the last element from an array. Here's an example:
        fruits.pop();
        console.log(fruits); //["apple", "banana", "orange"]


        //## Iterating over an Array
        //You can loop through all elements of an array using various looping mechanisms. Let's consider an example using a for loop:
        let cars = ["toyota", "honda", "ferrari"];


        for (let i = 0; i < cars.length; i++) {
            console.log(i);
            console.log(cars[i]);

            if(cars[i] == 'toyota') {
                console.log('i hate toyota');
            }
        }
