<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,301,400,401,500,501,700,701,900,901,2&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: 'Satoshi', sans-serif;
        }
    </style>
</head>
<body>
    <div class="flex flex-col mx-auto w-2/5 my-10 p-2">

        <input type="number" id="num1" placeholder="Enter first number" class=" border border-gray-500 p-2 rounded-xl mb-6">
        
        <input type="number" id="num2" placeholder="Enter second number" class=" border border-gray-500 p-2 rounded-xl mb-6">

        <select name="" id="operator" class=" border border-gray-500 p-2 rounded-xl mb-6">
            <option value="+">Add</option>
            <option value="-">Substract</option>
            <option value="*">Multiply</option>
            <option value="/">Division</option>
            <option value="%">Modulus</option>
        </select>

        <button onclick="calculate()" class=" border border-gray-500 p-2 rounded-xl w-1/5  bg-[#153f2a] text-white">Calculate</button>

        <div id="result" style="color: darkviolet;"></div>

    </div>
    <script>
        function calculate() {
            let num1 = document.getElementById("num1").value;   //Document Object Model - DOM API

            let num2 = document.getElementById("num2").value; 

            let operator = document.getElementById("operator").value; 

            num1 = Number(num1);

            num2 = Number(num2);

            let result; //undefined variable


            //conditional statements

            if (operator === "+") {
                result = num1 + num2;
            }
            else if (operator === "-") {
                result = num1 - num2;
            }
            else if (operator === "*") {
                result = num1 * num2;
            }
            else if (operator === "/") {
                result = num1 / num2;
            }
            else if (operator === "%") {
                result = num1 % num2;
            }

            if(result >= 30) {
                if(result % 2 === 0) {
                    document.getElementById("result").style ="color: red;";
                }
                else {
                    document.getElementById("result").style ="color: darkviolet;";
                }
            }
            else {
                document.getElementById("result").style ="color: darkviolet;";
            }

            document.getElementById("result").innerText ="Result: " + result;
        }

        // FUNCTIONS
        // 1. Named Functions 
            // It has a name and can be called later 

            function bye() {
                console.log ("goodbye");
            };

            bye();

        // 2. Anonymous Function
        //     it has no function name and its stored inside a variable

            let goodnight = function() {
            console.log ("odaaro");
            }
            
            goodnight();

        // 3. Arrow Functions
            // it is used to shorten function syntax when they are too long 

            let greet = () => {
                console.log ("hello")
            }

            greet();

        // 4. IIFE (Immediately Invoked Function Expression)   
        //         Run once Immediately and don't use again, doesn't pollute global scope 
                    // create ---> run ---> destroy

            (function() {
                console.log("wassup");
                    })();

        // 5. Generator Functions
        //         Control execution step-by-step
        //         start → yield 1 → pause
        //         resume → yield 2 → pause
        //         resume → yield 3 → pause

        function* numbers() {
            yield 1;
            yield 2;
            yield 3;
                    }

        let gen = numbers();
       console.log(gen.next());
       console.log(gen.next());
       console.log(gen.next());
       console.log(gen.next());

       
    </script>
</body>
</html>
