<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,301,400,401,500,501,700,701,900,901,2&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: 'Satoshi', sans-serif;
        }
    </style>
</head>
<body>
    <div class="flex flex-col mx-auto w-2/5 my-10 p-2">

    <input type="number" id="num1" placeholder="Enter first number" class=" border border-gray-500 p-2 rounded-xl ">
    <input type="number" id="num2" placeholder="Enter second number" class=" border border-gray-500 p-2 rounded-xl  ">

    <select name="" id="operator" class=" border border-gray-500 p-2 rounded-xl mb-3 ">
        <option value="+">Add</option>
         <option value="-">Substract</option>
          <option value="*">Multiply</option>
           <option value="/">Division</option>
    </select>
    <button onclick="calculate()" class=" border border-gray-500 p-2 rounded-xl w-1/5  bg-[#153f2a] text-white">Calculate</button>
    <div id="result" style="color: darkviolet;"></div>
    </div>
    <script>
        function calculate() {
            let num1 = document.getElementById("num1"). value; 
            let num2 = document.getElementById("num2"). value; 
            let operator = document.getElementById("operator"). value; 

            num1 =Number(num1);
            num2 =Number(num2);
            let result;
        if (operator === "+") {result = num1 + num2;}
        else if (operator === "-") {result = num1 - num2;}
        else if (operator === "*") {result = num1 * num2;}
        else if (operator === "/") {result = num1 / num2;}

            document.getElementById("result").innerText ="Result: " + result;
        }

        
    </script>
</body>
</html>
